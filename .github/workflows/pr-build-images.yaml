# PR Image Build Workflow
#
# Builds all Olares container images on PRs, pushing to the contributor's
# GitHub Container Registry namespace. This allows:
# - Testing the full image set from a PR
# - Spinning up VMs with PR-specific images
# - Integration testing before merge
#
# Images are pushed to: ghcr.io/<fork-owner>/olares-<image>:pr-<number>
# Or for main repo PRs: ghcr.io/beclab/olares-<image>:pr-<number>

name: PR Build Images

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'framework/**'
      - 'platform/**'
      - 'infrastructure/**'
      - 'build/container-native/**'
      - '.github/workflows/pr-build-images.yaml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build (optional, for manual triggers)'
        required: false
      registry_prefix:
        description: 'Registry prefix override (default: ghcr.io/<owner>)'
        required: false

env:
  # Default to PR author's namespace, can be overridden
  REGISTRY_PREFIX: ${{ inputs.registry_prefix || format('ghcr.io/{0}', github.event.pull_request.head.repo.owner.login || github.repository_owner) }}
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || github.run_number }}
  IMAGE_TAG: pr-${{ github.event.pull_request.number || inputs.pr_number || github.run_number }}-${{ github.sha }}
  SHORT_SHA: ${{ github.sha }}

jobs:
  # ==========================================================================
  # Prepare build matrix
  # ==========================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      registry: ${{ steps.registry.outputs.prefix }}
      tag: ${{ steps.registry.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine registry
        id: registry
        run: |
          PREFIX="${{ env.REGISTRY_PREFIX }}"
          TAG="pr-${{ env.PR_NUMBER }}"
          echo "prefix=${PREFIX}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "📦 Images will be pushed to: ${PREFIX}/olares-*:${TAG}"

      - name: Generate image matrix
        id: matrix
        run: |
          # Define all custom images to build
          cat > /tmp/images.json << 'EOF'
          [
            {
              "name": "os",
              "dockerfile": "build/container-native/Containerfile.olares-os",
              "context": "build/container-native",
              "platforms": "linux/amd64"
            },
            {
              "name": "installer",
              "dockerfile": "build/container-native/Containerfile.installer",
              "context": ".",
              "platforms": "linux/amd64"
            },
            {
              "name": "app-service",
              "dockerfile": "framework/app-service/Dockerfile",
              "context": "framework/app-service",
              "platforms": "linux/amd64,linux/arm64"
            },
            {
              "name": "bfl",
              "dockerfile": "framework/bfl/Dockerfile.api",
              "context": "framework/bfl",
              "platforms": "linux/amd64,linux/arm64"
            },
            {
              "name": "backup-server",
              "dockerfile": "framework/backup-server/Dockerfile",
              "context": "framework/backup-server",
              "platforms": "linux/amd64,linux/arm64"
            },
            {
              "name": "system-server",
              "dockerfile": "framework/system-server/Dockerfile",
              "context": "framework/system-server",
              "platforms": "linux/amd64,linux/arm64"
            },
            {
              "name": "l4-bfl-proxy",
              "dockerfile": "framework/l4-bfl-proxy/Dockerfile",
              "context": "framework/l4-bfl-proxy",
              "platforms": "linux/amd64,linux/arm64"
            },
            {
              "name": "middleware-operator",
              "dockerfile": "platform/tapr/docker/middleware/Dockerfile",
              "context": "platform/tapr",
              "platforms": "linux/amd64,linux/arm64"
            }
          ]
          EOF
          
          # Output as single line JSON
          IMAGES=$(cat /tmp/images.json | jq -c .)
          echo "images=${IMAGES}" >> $GITHUB_OUTPUT

  # ==========================================================================
  # Build all images in parallel
  # ==========================================================================
  build-images:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.prepare.outputs.images) }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.image.dockerfile }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Dockerfile not found: ${{ matrix.image.dockerfile }}"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image.name }}
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.image.platforms }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.registry }}/olares-${{ matrix.image.name }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.registry }}/olares-${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.head_ref }}
            olares.pr.number=${{ env.PR_NUMBER }}

  # ==========================================================================
  # Build bootc netinstall image
  # ==========================================================================
  build-netinstall:
    needs: [prepare, build-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create netinstall Containerfile
        run: |
          cat > /tmp/Containerfile.netinstall << EOF
          # Minimal netinstall image for Olares
          # This image boots, pulls the full OS image from registry, and installs
          #
          # Usage:
          #   bootc install to-disk --source-imgref <this-image> /dev/sda
          #   # System reboots and pulls full image on first boot
          
          FROM quay.io/centos-bootc/centos-bootc:stream9
          
          LABEL org.opencontainers.image.title="Olares Netinstall"
          LABEL org.opencontainers.image.description="Minimal installer that fetches Olares from registry"
          LABEL olares.registry="${{ needs.prepare.outputs.registry }}"
          LABEL olares.tag="${{ needs.prepare.outputs.tag }}"
          LABEL olares.pr="${{ env.PR_NUMBER }}"
          
          # Configure bootc to rebase to full image on first boot
          RUN mkdir -p /etc/olares
          
          COPY <<'BOOTSCRIPT' /usr/lib/systemd/system/olares-firstboot.service
          [Unit]
          Description=Olares First Boot - Rebase to full image
          ConditionPathExists=!/etc/olares/.rebased
          After=network-online.target
          Wants=network-online.target
          
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/bin/olares-rebase
          
          [Install]
          WantedBy=multi-user.target
          BOOTSCRIPT
          
          COPY <<'REBASESCRIPT' /usr/local/bin/olares-rebase
          #!/bin/bash
          set -euo pipefail
          
          REGISTRY="${{ needs.prepare.outputs.registry }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          FULL_IMAGE="\${REGISTRY}/olares-os:\${TAG}"
          
          echo "Olares Netinstall: Rebasing to \${FULL_IMAGE}..."
          
          # Rebase to full image
          bootc switch --transport registry "\${FULL_IMAGE}"
          
          # Mark as rebased
          touch /etc/olares/.rebased
          
          echo "Rebase complete. Rebooting to apply..."
          systemctl reboot
          REBASESCRIPT
          
          RUN chmod +x /usr/local/bin/olares-rebase && \
              systemctl enable olares-firstboot.service
          EOF

      - name: Build and push netinstall
        uses: docker/build-push-action@v5
        with:
          context: /tmp
          file: /tmp/Containerfile.netinstall
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.prepare.outputs.registry }}/olares-netinstall:${{ needs.prepare.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            olares.pr.number=${{ env.PR_NUMBER }}

  # ==========================================================================
  # Generate VM artifacts (optional, on-demand)
  # ==========================================================================
  build-vm:
    needs: [prepare, build-images]
    if: contains(github.event.pull_request.labels.*.name, 'build-vm')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    
    steps:
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build QCOW2
        run: |
          mkdir -p output
          
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v $(pwd)/output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --output /output \
            ${{ needs.prepare.outputs.registry }}/olares-os:${{ needs.prepare.outputs.tag }}

      - name: Upload QCOW2
        uses: actions/upload-artifact@v4
        with:
          name: olares-os-pr-${{ env.PR_NUMBER }}.qcow2
          path: output/*.qcow2
          retention-days: 3

  # ==========================================================================
  # Post summary comment on PR
  # ==========================================================================
  summary:
    needs: [prepare, build-images, build-netinstall]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    
    steps:
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const registry = '${{ needs.prepare.outputs.registry }}';
            const tag = '${{ needs.prepare.outputs.tag }}';
            const sha = '${{ github.sha }}'.substring(0, 7);
            
            const body = `## 🐳 Container Images Built
            
            All images from this PR are available in the container registry:
            
            | Image | Tag |
            |-------|-----|
            | \`${registry}/olares-os\` | \`${tag}\` |
            | \`${registry}/olares-installer\` | \`${tag}\` |
            | \`${registry}/olares-netinstall\` | \`${tag}\` |
            | \`${registry}/olares-app-service\` | \`${tag}\` |
            | \`${registry}/olares-bfl\` | \`${tag}\` |
            | ... | ... |
            
            ### Quick Test
            
            \`\`\`bash
            # Pull the OS image
            podman pull ${registry}/olares-os:${tag}
            
            # Or use netinstall for VM testing
            podman pull ${registry}/olares-netinstall:${tag}
            \`\`\`
            
            ### Create Test VM
            
            \`\`\`bash
            # Build QCOW2 from OS image
            sudo podman run --rm --privileged \\
              -v ./output:/output \\
              quay.io/centos-bootc/bootc-image-builder:latest \\
              --type qcow2 \\
              ${registry}/olares-os:${tag}
            
            # Start VM with libvirt/QEMU
            virt-install --name olares-pr-${{ env.PR_NUMBER }} \\
              --memory 4096 --vcpus 2 \\
              --disk ./output/image.qcow2 \\
              --import --os-variant centos-stream9
            \`\`\`
            
            > 💡 Add the \`build-vm\` label to automatically generate a QCOW2 artifact.
            
            <sub>Built from commit ${sha}</sub>`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('Container Images Built')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
