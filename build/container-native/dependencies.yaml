# Olares Container-Native Dependencies
# 
# This manifest defines dependencies for the container-native Olares OS:
# - bootstrap: Only 2 binaries needed (k3s + cni-plugins)
# - images: Everything else runs as containers
# - system: Kernel modules and system packages (optional)
#
# k3s includes containerd, kubelet, kubectl, crictl, ctr in a single binary.

apiVersion: olares.com/v1alpha1
kind: DependencyManifest
metadata:
  name: olares-dependencies
  version: "1.0.0"

spec:
  # ==========================================================================
  # BOOTSTRAP BINARIES (k3s mode - MINIMAL)
  # 
  # k3s includes: containerd, kubelet, kubectl, crictl, ctr
  # We only need k3s + cni-plugins (for Calico, since k3s uses flannel by default)
  # Helm can run as a container!
  # ==========================================================================
  bootstrap:
    # k3s: Single binary that includes everything
    # - containerd (container runtime)
    # - kubelet (node agent)  
    # - kubectl (CLI, via symlink)
    # - crictl, ctr (container tools)
    - id: k3s
      version: "1.33.3+k3s1"
      description: "Lightweight Kubernetes (includes containerd, kubelet, kubectl)"
      installPath: /usr/local/bin
      artifacts:
        linux/amd64:
          url: https://github.com/k3s-io/k3s/releases/download/v1.33.3+k3s1/k3s
          sha256: ""  # TODO: Add checksum
        linux/arm64:
          url: https://github.com/k3s-io/k3s/releases/download/v1.33.3+k3s1/k3s-arm64
          sha256: ""
      symlinks:
        - kubectl
        - crictl
        - ctr

    # CNI plugins for Calico networking
    # (k3s includes flannel, but Olares uses Calico for network policies)
    - id: cni-plugins
      version: "1.6.2"
      description: "Container Network Interface plugins (for Calico)"
      installPath: /opt/cni/bin
      artifacts:
        linux/amd64:
          url: https://github.com/containernetworking/plugins/releases/download/v1.6.2/cni-plugins-linux-amd64-v1.6.2.tgz
          sha256: ""
        linux/arm64:
          url: https://github.com/containernetworking/plugins/releases/download/v1.6.2/cni-plugins-linux-arm64-v1.6.2.tgz
          sha256: ""

  # ==========================================================================
  # CONTAINER IMAGES
  # Everything else runs as containers - no binary downloads needed
  # ==========================================================================
  images:
    # -------------------------------------------------------------------------
    # Kubernetes Control Plane
    # -------------------------------------------------------------------------
    - image: registry.k8s.io/kube-apiserver:v1.33.3
      description: "Kubernetes API server"
      required: true

    - image: registry.k8s.io/kube-controller-manager:v1.33.3
      description: "Kubernetes controller manager"
      required: true

    - image: registry.k8s.io/kube-scheduler:v1.33.3
      description: "Kubernetes scheduler"
      required: true

    - image: registry.k8s.io/kube-proxy:v1.33.3
      description: "Kubernetes network proxy"
      required: true

    - image: registry.k8s.io/etcd:3.5.18-0
      description: "Distributed key-value store"
      required: true

    - image: registry.k8s.io/pause:3.10
      description: "Pod infrastructure container"
      required: true

    - image: registry.k8s.io/coredns/coredns:v1.12.0
      description: "Cluster DNS"
      required: true

    # -------------------------------------------------------------------------
    # CLI Tools (run as containers)
    # NOTE: k3s provides kubectl/crictl via symlinks on the host, but these
    # container images are useful for the installer and containerized workflows
    # -------------------------------------------------------------------------
    - image: bitnami/kubectl:1.33.3
      description: "Kubernetes CLI (for installer container)"
      alias: kubectl

    - image: alpine/helm:3.17.1
      description: "Kubernetes package manager"
      alias: helm

    - image: quay.io/coreos/etcd:v3.5.18
      description: "etcd CLI tools (etcdctl)"
      alias: etcdctl

    # -------------------------------------------------------------------------
    # Storage & Backup
    # -------------------------------------------------------------------------
    - image: minio/minio:RELEASE.2023-05-04T21-44-30Z
      description: "Object storage server"

    - image: velero/velero:v1.11.3
      description: "Kubernetes backup tool"
      alias: velero

    - image: restic/restic:0.17.3
      description: "Backup program"
      alias: restic

    - image: juicedata/juicefs-csi-driver:v0.24.0
      description: "JuiceFS CSI driver"

    # -------------------------------------------------------------------------
    # Databases
    # -------------------------------------------------------------------------
    - image: redis:5.0.14-alpine
      description: "In-memory data store"

    - image: postgres:15-alpine
      description: "PostgreSQL database"

    - image: mongo:6.0
      description: "MongoDB database"

    # -------------------------------------------------------------------------
    # Utilities
    # -------------------------------------------------------------------------
    - image: alpine/socat:1.7.4.4
      description: "Multipurpose relay"
      alias: socat

    - image: curlimages/curl:8.5.0
      description: "HTTP client"
      alias: curl

    # -------------------------------------------------------------------------
    # Olares System Components
    # -------------------------------------------------------------------------
    - image: owncloudci/wait-for:latest
      description: "Wait for services"

    - image: liangjw/kube-webhook-certgen:v1.1.1
      description: "Webhook certificate generator"

    - image: beclab/alpine:3.14
      description: "Olares base image"

    - image: beclab/kube-rbac-proxy:0.19.0
      description: "RBAC proxy"

    # -------------------------------------------------------------------------
    # Additional Olares images
    # TODO: Import remaining images from .olares/Olares.yaml containers sections
    # -------------------------------------------------------------------------

  # ==========================================================================
  # KERNEL/SYSTEM REQUIREMENTS
  # These cannot be containerized - they're kernel modules or system packages
  # ==========================================================================
  system:
    - id: nvidia-driver
      version: "590.44.01"
      description: "NVIDIA GPU driver (kernel module)"
      optional: true
      condition: "gpu.vendor == 'nvidia'"
      artifacts:
        linux/amd64:
          url: https://us.download.nvidia.com/XFree86/Linux-x86_64/590.44.01/NVIDIA-Linux-x86_64-590.44.01.run
        linux/arm64:
          url: https://us.download.nvidia.com/XFree86/aarch64/590.44.01/NVIDIA-Linux-aarch64-590.44.01.run

    - id: nvidia-container-toolkit
      description: "NVIDIA container runtime hook"
      optional: true
      condition: "gpu.vendor == 'nvidia'"
      # Installed via package manager, not direct download

