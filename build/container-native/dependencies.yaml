# Olares Container-Native Dependencies
# 
# This manifest separates dependencies into:
# - bootstrap: Minimal binaries required on host to start container runtime
# - images: Everything else runs as containers
#
# Migration from legacy .olares/Olares.yaml format

apiVersion: olares.com/v1alpha1
kind: DependencyManifest
metadata:
  name: olares-dependencies
  version: "1.0.0"

spec:
  # ==========================================================================
  # BOOTSTRAP BINARIES
  # These MUST be installed on the host - they bootstrap the container runtime
  # ==========================================================================
  bootstrap:
    # Container runtime (chicken-and-egg: need this to run containers)
    - id: containerd
      version: "2.1.3"
      description: "Container runtime daemon"
      installPath: /usr/local/bin
      artifacts:
        linux/amd64:
          url: https://github.com/containerd/containerd/releases/download/v2.1.3/containerd-2.1.3-linux-amd64.tar.gz
          sha256: ""  # TODO: Add checksum
        linux/arm64:
          url: https://github.com/containerd/containerd/releases/download/v2.1.3/containerd-2.1.3-linux-arm64.tar.gz
          sha256: ""

    - id: runc
      version: "1.2.5"
      description: "OCI runtime"
      installPath: /usr/local/bin
      artifacts:
        linux/amd64:
          url: https://github.com/opencontainers/runc/releases/download/v1.2.5/runc.amd64
          sha256: ""
        linux/arm64:
          url: https://github.com/opencontainers/runc/releases/download/v1.2.5/runc.arm64
          sha256: ""

    - id: cni-plugins
      version: "1.6.2"
      description: "Container Network Interface plugins"
      installPath: /opt/cni/bin
      artifacts:
        linux/amd64:
          url: https://github.com/containernetworking/plugins/releases/download/v1.6.2/cni-plugins-linux-amd64-v1.6.2.tgz
          sha256: ""
        linux/arm64:
          url: https://github.com/containernetworking/plugins/releases/download/v1.6.2/cni-plugins-linux-arm64-v1.6.2.tgz
          sha256: ""

    # Kubernetes node agent (manages pods on host)
    - id: kubelet
      version: "1.33.3"
      description: "Kubernetes node agent"
      installPath: /usr/local/bin
      artifacts:
        linux/amd64:
          url: https://dl.k8s.io/release/v1.33.3/bin/linux/amd64/kubelet
          sha256: ""
        linux/arm64:
          url: https://dl.k8s.io/release/v1.33.3/bin/linux/arm64/kubelet
          sha256: ""

    # Alternative: k3s (single binary, includes everything)
    # Uncomment this and comment out kubelet if using k3s
    # - id: k3s
    #   version: "1.33.3+k3s1"
    #   description: "Lightweight Kubernetes"
    #   installPath: /usr/local/bin
    #   artifacts:
    #     linux/amd64:
    #       url: https://github.com/k3s-io/k3s/releases/download/v1.33.3+k3s1/k3s
    #       sha256: ""
    #     linux/arm64:
    #       url: https://github.com/k3s-io/k3s/releases/download/v1.33.3+k3s1/k3s-arm64
    #       sha256: ""

  # ==========================================================================
  # CONTAINER IMAGES
  # Everything else runs as containers - no binary downloads needed
  # ==========================================================================
  images:
    # -------------------------------------------------------------------------
    # Kubernetes Control Plane
    # -------------------------------------------------------------------------
    - image: registry.k8s.io/kube-apiserver:v1.33.3
      description: "Kubernetes API server"
      required: true

    - image: registry.k8s.io/kube-controller-manager:v1.33.3
      description: "Kubernetes controller manager"
      required: true

    - image: registry.k8s.io/kube-scheduler:v1.33.3
      description: "Kubernetes scheduler"
      required: true

    - image: registry.k8s.io/kube-proxy:v1.33.3
      description: "Kubernetes network proxy"
      required: true

    - image: registry.k8s.io/etcd:3.5.18-0
      description: "Distributed key-value store"
      required: true

    - image: registry.k8s.io/pause:3.10
      description: "Pod infrastructure container"
      required: true

    - image: registry.k8s.io/coredns/coredns:v1.12.0
      description: "Cluster DNS"
      required: true

    # -------------------------------------------------------------------------
    # CLI Tools (run as containers, replace binary downloads)
    # -------------------------------------------------------------------------
    - image: bitnami/kubectl:1.33.3
      description: "Kubernetes CLI"
      alias: kubectl
      replaces: "infrastructure/kubernetes kubectl binary"

    - image: alpine/helm:3.17.1
      description: "Kubernetes package manager"
      alias: helm
      replaces: "infrastructure/helm binary"

    - image: quay.io/coreos/etcd:v3.5.18
      description: "etcd CLI tools"
      alias: etcdctl
      replaces: "infrastructure/etcd binary"

    - image: registry.k8s.io/cri-tools/crictl:v1.32.0
      description: "Container runtime CLI"
      alias: crictl
      replaces: "infrastructure/cri-tools binary"

    # -------------------------------------------------------------------------
    # Storage & Backup (run as containers)
    # -------------------------------------------------------------------------
    - image: minio/minio:RELEASE.2023-05-04T21-44-30Z
      description: "Object storage server"
      replaces: "infrastructure/minio binary"

    - image: velero/velero:v1.11.3
      description: "Kubernetes backup tool"
      alias: velero
      replaces: "platform/velero binary"

    - image: restic/restic:0.17.3
      description: "Backup program"
      alias: restic
      replaces: "infrastructure/restic binary"

    - image: juicedata/juicefs-csi-driver:v0.24.0
      description: "JuiceFS CSI driver"
      replaces: "platform/juicefs binary (partial)"

    # -------------------------------------------------------------------------
    # Databases (already containerized in original)
    # -------------------------------------------------------------------------
    - image: redis:5.0.14-alpine
      description: "In-memory data store"
      # NOTE: This replaces BOTH the redis container AND the redis binary
      # The binary in platform/redis is now redundant

    - image: postgres:15-alpine
      description: "PostgreSQL database"

    - image: mongo:6.0
      description: "MongoDB database"

    # -------------------------------------------------------------------------
    # Utilities
    # -------------------------------------------------------------------------
    - image: alpine/socat:1.7.4.4
      description: "Multipurpose relay"
      alias: socat
      replaces: "infrastructure/socat binary"

    - image: curlimages/curl:8.5.0
      description: "HTTP client"
      alias: curl

    # -------------------------------------------------------------------------
    # Olares System Components
    # -------------------------------------------------------------------------
    - image: owncloudci/wait-for:latest
      description: "Wait for services"

    - image: liangjw/kube-webhook-certgen:v1.1.1
      description: "Webhook certificate generator"

    - image: beclab/alpine:3.14
      description: "Olares base image"

    - image: beclab/kube-rbac-proxy:0.19.0
      description: "RBAC proxy"

    # -------------------------------------------------------------------------
    # Additional images from original manifests
    # (These were already containers, just consolidating here)
    # -------------------------------------------------------------------------
    # TODO: Import remaining images from .olares/Olares.yaml containers sections

  # ==========================================================================
  # KERNEL/SYSTEM REQUIREMENTS
  # These cannot be containerized - they're kernel modules or system packages
  # ==========================================================================
  system:
    - id: nvidia-driver
      version: "590.44.01"
      description: "NVIDIA GPU driver (kernel module)"
      optional: true
      condition: "gpu.vendor == 'nvidia'"
      artifacts:
        linux/amd64:
          url: https://us.download.nvidia.com/XFree86/Linux-x86_64/590.44.01/NVIDIA-Linux-x86_64-590.44.01.run
        linux/arm64:
          url: https://us.download.nvidia.com/XFree86/aarch64/590.44.01/NVIDIA-Linux-aarch64-590.44.01.run

    - id: nvidia-container-toolkit
      description: "NVIDIA container runtime hook"
      optional: true
      condition: "gpu.vendor == 'nvidia'"
      # Installed via package manager, not direct download

  # ==========================================================================
  # DEPRECATED BINARIES
  # These were in the old format but are now replaced by containers above
  # Kept here for reference during migration
  # ==========================================================================
  deprecated:
    - id: kubeadm
      reason: "Use registry.k8s.io/kubeadm container or k3s"
      replacedBy: "k3s bootstrap or kubeadm container"

    - id: kubectl
      reason: "Use bitnami/kubectl:1.33.3 container"
      replacedBy: "images[alias=kubectl]"

    - id: helm
      reason: "Use alpine/helm:3.17.1 container"
      replacedBy: "images[alias=helm]"

    - id: etcd
      reason: "Runs as pod in control plane"
      replacedBy: "images[registry.k8s.io/etcd]"

    - id: minio-binary
      reason: "Use minio/minio container"
      replacedBy: "images[minio/minio]"

    - id: redis-binary
      reason: "Use redis:5.0.14-alpine container"
      replacedBy: "images[redis]"

    - id: velero-binary
      reason: "Use velero/velero container"
      replacedBy: "images[alias=velero]"

    - id: restic-binary
      reason: "Use restic/restic container"
      replacedBy: "images[alias=restic]"

    - id: socat-binary
      reason: "Use alpine/socat container"
      replacedBy: "images[alias=socat]"

    - id: conntrack-tools
      reason: "Available in base OS or as container"
      replacedBy: "Base OS package or init container"

    - id: apparmor
      reason: "System package, not direct download"
      replacedBy: "Base OS package"
